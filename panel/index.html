<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>Motion Blur</title><link rel="stylesheet" href="panel.css"></head>
<body><main>
<h1>Motion Blur</h1>
<p>Select an H.264 clip with the same frame rate as the sequence. The image is read from the source file before effects and transforms.</p>
<div class="label"><label for="angle">Shutter angle</label><output id="degrees" for="angle">180°</output></div>
<input type="range" id="angle" min="0" max="360" step="5" value="180">
<label for="samples">Exposure samples per frame</label>
<select id="samples"><option>4</option><option selected>8</option><option>16</option></select>
<button id="render">Render to track above</button>
<button id="cancel" hidden>Cancel render</button>
<progress id="progress" hidden></progress><p id="status" role="status" aria-live="polite">Ready.</p>
</main><script src="panel.js"></script></body></html>
